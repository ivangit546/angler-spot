{% extends 'angler/base.html'%}
{% block content %}
<div class="title-row-rod">
    <h2 class="section-title">Add a new catch!</h2>
</div>
<div class="practice-box3">
    <form method="POST" action="{% url 'fishdex_entry'%}" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-field">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="form-btn">Submit</button>
    </form>
</div>

{% endblock %}
