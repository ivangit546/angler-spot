{% extends 'angler/base.html' %}
{% block content%}

<div class="title-row-rod">
    <h2 class="section-title">Change {{action}}</h2>
</div>

<div class="rodreal-box3">
    <form method="POST" action="{% url 'edit_account' action=action %}" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-field">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
        </div>
        {% if field.errors %}
                <div class="text-danger small">
                    {{ field.errors|striptags }}
                </div>
            {% endif %}
        {% endfor %}
        <button type="submit" class="form-btn">Submit</button>
    </form>
    
</div>

{% endblock %}
