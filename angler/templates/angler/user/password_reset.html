{% extends 'angler/base.html' %}
{% block content %}

<div class="auth-page">
    <div class="auth-box">
        <h2 class="section-title" style="font-size: 28px; width: 100%; max-width: 100%; white-space: normal; word-break: break-word;">Reset Password</h2> 
        <form method="post">
            {% csrf_token %}
            <div class="form-field">
                <label class="form-label">{{ form.email.label_tag }}</label>
                {{ form.email }}
                {{ form.email.errors }}
            </div>
            <button type="submit" class="form-btn" style="align-self: center; margin-top: 8px;">Submit</button>
        </form>
        <p class="auth-footer">Enter email to reset password.</p>
    </div>
</div>
{% endblock %}
