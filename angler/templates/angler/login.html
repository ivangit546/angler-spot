<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    
</head>

<body>
    
    <form method=POST>
        <h1>Login</h1>

        {% csrf_token %}
        <div>
            <input type="text" name='username' placeholder="Username" required>

        </div>
        <div>
            <input type="password" name='password' placeholder="Password" required>
 
        </div>

        <button type="submit" class="btn">Login</button>
        {% if messages %}
            {% for message in messages %}
                <div>{{message}}</div>
            {% endfor %}
        {% endif %}
        
    </form>
</div>
</body>
</html>
