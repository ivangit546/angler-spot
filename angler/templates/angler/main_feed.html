{% extends 'angler/base.html'%}
{% block content %}

    <h2>Feed</h2>
    <br>
        {% if posts %}
            <ul>
                {% for post in posts %}
                <li>
                    <h2>{{post.title}}</h2>
                    <p>{{post.text}}</p>
                    {% if post.post_image %}
                        <img src="{{post.post_image.url}}">
                    {% endif %}
                </li>
                <details>
                    <summary>Reply</summary>
                    <div>
                        <textarea rows="4" cols="50" placeholder="Enter your reply here..."></textarea>
                        <br>
                        <button type="submit">Post</button>
                    </div>
                </details>
                {% endfor %}
            </ul>
        {% endif %}    
{% endblock %}
